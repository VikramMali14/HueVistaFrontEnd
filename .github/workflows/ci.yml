name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # jsdom 30 (and the undici it pulls in) dropped Node 20: undici calls
          # `webidl.util.markAsUncloneable`, which does not exist there, so every
          # jsdom-environment test file fails to start its worker. Node 26 is not
          # usable either — `localStorage` is undefined under jsdom there, failing
          # 23 tests. 22.x satisfies jsdom's `^22.22.2` and is the verified-good
          # version for the suite.
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_ORIGIN: http://localhost:8080
