name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # 22, not 20: jsdom 30 pulls in undici 8, whose CacheStorage calls
          # webidl.util.markAsUncloneable — backed by node:worker_threads'
          # markAsUncloneable, which does not exist before 22.10. On 20 every
          # jsdom test worker dies at import with "markAsUncloneable is not a
          # function" and the suite reports 19 unhandled errors while still
          # exiting non-zero. Broke on main when jsdom 30 landed (#138).
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_ORIGIN: http://localhost:8080
